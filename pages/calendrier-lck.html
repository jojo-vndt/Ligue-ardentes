<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendrier LCK</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header id="site-header"></header>

  <main class="calendrier">
    <h1>📅 Calendrier LCK</h1>
    <section id="calendrier-lck" class="calendrier-section"></section>
  </main>

 

  <script>
    fetch("ligues/calendrier/lck-calendrier.json")  // ❗️Chemin relatif depuis le fichier HTML
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById("calendrier-lck");
    data.forEach(match => {
      const div = document.createElement("div");
      div.classList.add("match-item");
      div.innerHTML = `<p><strong>${match.date}</strong> à ${match.time} — ${match.team1} vs ${match.team2}</p>`;
      container.appendChild(div);
    });
  });
  fetch("../components/header.html")
    .then(res => res.text())
    .then(data => document.getElementById("site-header").innerHTML = data);

  fetch("../components/footer.html")
    .then(res => res.text())
    .then(data => document.getElementById("site-footer").innerHTML = data);
  </script>
 <footer id="site-footer"></footer>
</body>
</html>
