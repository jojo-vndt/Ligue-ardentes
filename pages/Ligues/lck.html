<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCK - Classement</title>
  <link rel="stylesheet" href="../../style.css">
</head>
<body>

  <header id="site-header"></header>
<section class="classement">
  <h1>🇫🇷 Classement LCK</h1>
  <table>
    <thead>
      <tr>
        <th>Position</th>
        <th>Équipe</th>
        <th>Matchs joués</th>
        <th>Victoires</th>
        <th>Défaites</th>
        <th>Diff.</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td><td>GenG</td><td>20</td><td>19</td><td>1</td><td>+19</td>
      </tr>
      <tr>
        <td>2</td><td>HLE</td><td>20</td><td>15</td><td>5</td><td>+15</td>
      </tr>
      <tr>
        <td>3</td><td>T1</td><td>20</td><td>13</td><td>7</td><td>+13</td>
      </tr>
      <tr>
        <td>4</td><td>KT Rolster</td><td>20</td><td>11</td><td>9</td><td>+11</td>
      </tr>
      <tr>
        <td>5</td><td>NS</td><td>20</td><td>10</td><td>10</td><td>+10</td>
      </tr>
      <tr>
        <td>6</td><td>Dplus Kia</td><td>20</td><td>11</td><td>9</td><td>+11</td>
      </tr>
      <tr>
        <td>7</td><td>Brion</td><td>20</td><td>7</td><td>13</td><td>+7</td>
      </tr>
      <tr>
        <td>8</td><td>FearX</td><td>20</td><td>7</td><td>13</td><td>+7</td>
      </tr>
      <tr>
        <td>9</td><td>DRX</td><td>20</td><td>6</td><td>14</td><td>+6</td>
      </tr>
      <tr>
        <td>10</td><td>DnFreecs</td><td>20</td><td>1</td><td>19</td><td>+1</td>
      </tr>
      <tr>
    </tbody>
  </table>
</section>
<script>
    const path = window.location.pathname;
    let base = "/components/";

    if (path.includes("/pages/ligues/")) {
      base = "/components/"; // reste absolu si tu héberges tout à la racine
    }

    fetch(base + "header.html")
      .then(res => res.text())
      .then(data => document.getElementById("site-header").innerHTML = data);

    fetch(base + "footer.html")
      .then(res => res.text())
      .then(data => document.getElementById("site-footer").innerHTML = data);
  </script>
  <section class="calendrier">
  <h2>📅 Calendrier LCK</h2>
  <div id="calendrier-lck"></div>
</section>
<script>
fetch("calendrier/lck-calendrier.json")
  .then(response => response.json())
  .then(data => {
    const container = document.getElementById("calendrier-lck");
    
    data.forEach(match => {
      const div = document.createElement("div");
      div.classList.add("match-item");
      div.innerHTML = `
        <p><strong>${match.date}</strong> à ${match.time} — ${match.team1} vs ${match.team2}</p>
      `;
      container.appendChild(div);
    });
  })
  .catch(error => {
    console.error("Erreur de chargement du calendrier :", error);
  });
</script>
<footer id="site-footer"></footer>
</body>
</html>
